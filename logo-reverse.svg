<?xml version="1.0" encoding="UTF-8"?>
<!--
  BRiZ wordmark · reverse (ivory on dark)
  Identical geometry to logo-wordmark.svg, inverted color.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 220 64"
     role="img"
     aria-label="BRiZ"
     preserveAspectRatio="xMinYMid meet">
  <title>BRiZ</title>
  <style>
    .briz-wordmark-reverse {
      font-family: "Inter Tight", "Inter", -apple-system, "Helvetica Neue", Arial, sans-serif;
      font-weight: 500;
      font-size: 56px;
      letter-spacing: -0.05em;
      fill: #F2EDE4;
      font-feature-settings: "ss01" on, "cv11" on;
    }
  </style>
  <text x="0" y="48" class="briz-wordmark-reverse">BRıZ</text>
  <rect x="119" y="9" width="10" height="10"
        transform="rotate(45 124 14)"
        fill="none"
        stroke="#F2EDE4"
        stroke-width="2.2"
        stroke-linejoin="miter"/>
</svg>
